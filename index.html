<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Design a flat plate — a sign, a keychain, a tag — and download it as STL for 3D printing." />
    <title>Plate Builder</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#294edb" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <header>
      <span class="brand" data-i18n="title">Plate Builder</span>
      <select id="locale" aria-label="Language" data-i18n-label="languageLabel">
        <option value="en" lang="en">English</option>
        <option value="ru" lang="ru">Русский</option>
        <option value="uk" lang="uk">Українська</option>
        <option value="he" lang="he">עברית</option>
      </select>
    </header>
    <main>
      <h1 data-i18n="heading">Plate Builder</h1>
      <p data-i18n="intro">A plate for 3D printing: an outline, images, texts and holes.</p>
      <output id="engine" aria-live="polite">Loading the geometry engine…</output>
    </main>
    <footer>
      <a href="https://github.com/dmitryweiner/plate-builder" data-i18n="source">Source code</a>
      · GPL-3.0-or-later
    </footer>
  </body>
</html>
