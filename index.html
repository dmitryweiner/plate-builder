<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="Design a flat plate — a sign, a keychain, a tag — and download it as STL for 3D printing." />
    <title>Plate Builder</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#294edb" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script type="module" src="./src/main.ts"></script>
  </head>
  <body>
    <header class="topbar">
      <span class="brand" data-i18n="title">Plate Builder</span>
      <span class="spacer"></span>
      <button id="undo" type="button" class="tool-button" title="Undo" aria-label="Undo" data-i18n-label="undo">↶</button>
      <button id="redo" type="button" class="tool-button" title="Redo" aria-label="Redo" data-i18n-label="redo">↷</button>
      <select id="locale" aria-label="Language" data-i18n-label="languageLabel">
        <option value="en" lang="en">English</option>
        <option value="ru" lang="ru">Русский</option>
        <option value="uk" lang="uk">Українська</option>
        <option value="he" lang="he">עברית</option>
      </select>
    </header>
    <main class="workspace">
      <section class="views" id="views" data-show="2d" aria-label="Views" data-i18n-label="views">
        <div class="view-tabs">
          <button type="button" data-show="2d" data-i18n="view2d">2D</button>
          <button type="button" data-show="3d" data-i18n="view3dTab">3D</button>
        </div>
        <div class="pane pane2d">
          <canvas id="view2d" aria-label="Plate, top view" data-i18n-label="editor2d"></canvas>
          <label class="snap-toggle"><input id="snapping" type="checkbox" checked /> <span data-i18n="snapping">Snap</span></label>
        </div>
        <div class="pane pane3d" aria-label="3D view" data-i18n-label="view3d">
          <canvas id="view3d"></canvas>
          <div class="cameras">
            <button type="button" data-camera="front" data-i18n="cameraFront">Front</button>
            <button type="button" data-camera="iso" data-i18n="cameraIso">Angle</button>
            <button type="button" data-camera="back" data-i18n="cameraBack">Back</button>
          </div>
          <output id="status" class="status" aria-live="polite"></output>
        </div>
        <button id="swapViews" type="button" class="swap-views" title="Swap views" aria-label="Swap views" data-i18n-label="swapViews">
          ⇄
        </button>
      </section>
      <div class="panel">
        <section class="card" id="plateCard">
          <h2 data-i18n="plateCard">Plate</h2>
          <div id="plateControls"></div>
          <div id="vignettePicker" class="vignette-picker" role="listbox" aria-label="Vignettes" data-i18n-label="vignettes" hidden></div>
          <div id="svgChooser" hidden>
            <button id="svgUpload" type="button" class="secondary" data-i18n="uploadSvg">Choose an SVG file…</button>
            <input id="svgFile" type="file" accept=".svg,image/svg+xml" hidden />
          </div>
          <p id="plateStatus" class="error" role="alert" hidden></p>
        </section>
        <section class="card" id="elementsCard">
          <h2 data-i18n="elementsCard">Elements</h2>
          <ul id="elementList" class="element-list"></ul>
          <div class="add-buttons">
            <button id="addText" type="button" class="secondary" data-i18n="addText">Add text</button>
            <button id="addImage" type="button" class="secondary" data-i18n="addImage">Add image</button>
            <button id="addHole" type="button" class="secondary" data-i18n="addHole">Add hole</button>
            <input id="imageFile" type="file" accept="image/*" hidden />
          </div>
          <p id="elementsStatus" class="error" role="alert" hidden></p>
        </section>
        <section class="card" id="selectedCard" hidden>
          <h2 id="selectedTitle"></h2>
          <canvas id="selectedThumb" class="thumb" hidden></canvas>
          <div id="selectedControls"></div>
        </section>
        <section class="card" id="warningsCard" hidden>
          <h2 data-i18n="warningsCard">Warnings</h2>
          <ul id="warningList" class="warning-list"></ul>
        </section>
        <section class="card" id="exportCard">
          <h2 data-i18n="exportCard">Export</h2>
          <p id="meshInfo" class="note"></p>
          <p id="meshBlocked" class="error" role="alert" hidden></p>
          <button id="downloadStl" type="button" class="primary" data-i18n="downloadStl">Download STL</button>
          <output id="exportStatus" class="note" aria-live="polite"></output>
        </section>
        <footer>
          <a href="https://github.com/dmitryweiner/plate-builder" data-i18n="source">Source code</a>
          · GPL-3.0-or-later
        </footer>
      </div>
    </main>
  </body>
</html>
